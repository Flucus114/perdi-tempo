name: Build Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair zip
        run: |
          mkdir -p extraido
          unzip -q ./*.zip -d extraido

      - name: Localizar projeto Gradle
        id: loc
        run: |
          F=$(find extraido -name settings.gradle | head -n1)
          if [ -z "$F" ]; then echo "settings.gradle nao encontrado"; ls -R extraido | head -50; exit 1; fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Ajustar versao da GeckoLib
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          sed -i 's/geckolib-forge-1.20.1:4.3.4/geckolib-forge-1.20.1:4.4.9/' build.gradle
          grep geckolib build.gradle

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: devourer_of_the_void-jar
          path: ${{ steps.loc.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
